<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — Quiz System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Quiz System</span>
    <nav>
      <a href="/dashboard.html">Quizzes</a>
      <a href="/history.html">History</a>
      <a href="/profile.html">Progress</a>
      <a href="#" id="logoutLink">Sign out</a>
    </nav>
  </div>

  <div class="container wide">
    <h1>Your attempt history</h1>
    <p>Every attempt is kept, including ones you didn't finish.</p>
    <div class="error-banner" id="errorBanner"></div>
    <table id="historyTable" style="display:none">
      <thead><tr><th>Quiz</th><th>Score</th><th>Status</th><th>Started</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none">No attempts yet — go take a quiz.</div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    requireAuth('USER');
    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    const errorBanner = document.getElementById('errorBanner');

    async function load() {
      try {
        const history = await api('/api/attempts/history');
        if (history.length === 0) {
          document.getElementById('emptyState').style.display = 'block';
          return;
        }
        document.getElementById('historyTable').style.display = 'table';
        document.getElementById('historyBody').innerHTML = history.map(h => `
          <tr>
            <td>${escapeHtml(h.quizTitle)}</td>
            <td>${h.score}/${h.totalQuestions}</td>
            <td><span class="badge ${h.status.toLowerCase()}">${h.status}</span></td>
            <td>${new Date(h.startTime).toLocaleString()}</td>
            <td>${h.status !== 'ACTIVE' ? `<a href="/result.html?attemptId=${h.attemptId}">View</a>` : ''}</td>
          </tr>
        `).join('');
      } catch (err) {
        showError(errorBanner, err.message);
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    load();
  </script>
</body>
</html>
