<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quizzes — Quiz System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Quiz System</span>
    <nav>
      <a href="/dashboard.html">Quizzes</a>
      <a href="/history.html">History</a>
      <a href="/profile.html">Progress</a>
      <a href="#" id="logoutLink">Sign out</a>
    </nav>
  </div>

  <div class="container">
    <h1>Available quizzes</h1>
    <p>Pick a quiz to begin. Each attempt draws a fresh, randomly ordered set of questions — you can attempt any quiz as many times as you like.</p>

    <div class="error-banner" id="errorBanner"></div>
    <div id="quizList"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    requireAuth('USER');
    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    const errorBanner = document.getElementById('errorBanner');
    const quizList = document.getElementById('quizList');

    async function load() {
      try {
        const quizzes = await api('/api/quizzes');
        if (quizzes.length === 0) {
          quizList.innerHTML = '<div class="empty-state">No quizzes are available yet. Check back soon.</div>';
          return;
        }
        quizList.innerHTML = quizzes.map(q => `
          <div class="quiz-list-item">
            <div>
              <h3 style="margin-bottom:0.15rem">${escapeHtml(q.title)}</h3>
              <div class="quiz-meta">${escapeHtml(q.categoryName)} · ${q.questionsPerAttempt} questions · ${q.timeLimitMinutes} min</div>
            </div>
            <div>
              <a class="btn" href="/quiz-attempt.html?quizId=${q.id}">Start</a>
              <a class="btn secondary" href="/leaderboard.html?quizId=${q.id}&title=${encodeURIComponent(q.title)}">Leaderboard</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showError(errorBanner, err.message);
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    load();
  </script>
</body>
</html>
