<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizMaster — Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-reference-page">
  <main class="reference-login">
    <section class="reference-login-card" aria-label="QuizMaster registration">
      <div class="reference-tabs">
        <a href="/index.html">Login</a>
        <a class="active" href="/register.html">Register</a>
      </div>

      <div class="error-banner" id="errorBanner"></div>

      <form id="registerForm">
        <div class="reference-field">
          <span class="reference-icon">♙</span>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Full Name" autocomplete="name" required>
        </div>
        <div class="reference-field">
          <span class="reference-icon">✉</span>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Email" autocomplete="email" required>
        </div>
        <div class="reference-field">
          <span class="reference-icon">♙</span>
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" placeholder="Password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="reference-submit" id="submitBtn">Register</button>
      </form>

      <div class="reference-divider">OR</div>
      <button type="button" class="reference-social" disabled><span class="social-mark">G</span>Continue with Google</button>
      <button type="button" class="reference-social" disabled><span class="social-mark">●</span>Continue with GitHub</button>
      <p class="reference-footer">Already have an account? <a href="/index.html">Login</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const errorBanner = document.getElementById('errorBanner');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError(errorBanner);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        const auth = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        setAuth(auth);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError(errorBanner, err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register';
      }
    });
  </script>
</body>
</html>
