<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attempt — Quiz System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Quiz System</span>
    <span class="timer" id="timer">--:--</span>
  </div>

  <div class="container">
    <div class="error-banner" id="errorBanner"></div>

    <div id="attemptArea"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    requireAuth('USER');

    const params = new URLSearchParams(window.location.search);
    const quizId = params.get('quizId');
    const errorBanner = document.getElementById('errorBanner');
    const attemptArea = document.getElementById('attemptArea');
    const timerEl = document.getElementById('timer');

    let attempt = null;
    let currentIndex = 0;
    // Local map of questionId -> selectedOptionId, for instant UI feedback
    // and to preserve selections while navigating (Section 42). The
    // backend's saved AttemptAnswer rows remain the source of truth for scoring.
    const localAnswers = {};
    let countdownHandle = null;
    let submitting = false;

    async function start() {
      try {
        attempt = await api(`/api/quizzes/${quizId}/attempts`, { method: 'POST' });
        renderQuestion(0);
        startCountdown(attempt.secondsRemaining);
      } catch (err) {
        showError(errorBanner, err.message);
      }
    }

    function startCountdown(seconds) {
      let remaining = Math.floor(seconds);
      updateTimerDisplay(remaining);
      countdownHandle = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(countdownHandle);
          updateTimerDisplay(0);
          // Section 15: timer hitting zero triggers automatic submission.
          // The backend's expiry sweep is the real safety net (Section 20)
          // if this call never reaches the server — this is just the
          // happy-path auto-submit while the tab is still open.
          doSubmit(true);
          return;
        }
        updateTimerDisplay(remaining);
      }, 1000);
    }

    function updateTimerDisplay(totalSeconds) {
      const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      const s = (totalSeconds % 60).toString().padStart(2, '0');
      timerEl.textContent = `${m}:${s}`;
      timerEl.classList.toggle('critical', totalSeconds <= 60);
    }

    function renderQuestion(index) {
      currentIndex = index;
      const q = attempt.questions[index];
      const selected = localAnswers[q.questionId];

      attemptArea.innerHTML = `
        <div class="attempt-header">
          <h2 style="margin:0">${escapeHtml(attempt.quizTitle)}</h2>
          <span class="attempt-progress">Question ${q.position + 1} of ${attempt.totalQuestions}</span>
        </div>
        <div class="question-block">
          <div class="question-text">${escapeHtml(q.text)}</div>
          <div id="options"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <button class="secondary" id="prevBtn" ${index === 0 ? 'disabled' : ''}>Previous</button>
            <button class="secondary" id="nextBtn" ${index === attempt.questions.length - 1 ? 'disabled' : ''}>Next</button>
          </div>
          <button id="submitBtn">Submit quiz</button>
        </div>
        <div class="helper-text">${attempt.questions.map((qq, i) =>
          `<a href="#" data-jump="${i}" style="margin-right:0.75rem; ${localAnswers[qq.questionId] !== undefined ? 'color: var(--success); font-weight:600;' : ''}">${i + 1}</a>`
        ).join('')}</div>
      `;

      const optionsDiv = document.getElementById('options');
      q.options.forEach(opt => {
        const row = document.createElement('div');
        row.className = 'option-row' + (selected === opt.id ? ' selected' : '');
        row.innerHTML = `<input type="radio" name="opt" ${selected === opt.id ? 'checked' : ''}> <span>${escapeHtml(opt.text)}</span>`;
        row.addEventListener('click', () => selectOption(q.questionId, opt.id));
        optionsDiv.appendChild(row);
      });

      document.getElementById('prevBtn').addEventListener('click', () => renderQuestion(currentIndex - 1));
      document.getElementById('nextBtn').addEventListener('click', () => renderQuestion(currentIndex + 1));
      document.getElementById('submitBtn').addEventListener('click', () => {
        if (confirm('Submit this quiz? You will not be able to change your answers afterward.')) {
          doSubmit(false);
        }
      });
      attemptArea.querySelectorAll('[data-jump]').forEach(a => {
        a.addEventListener('click', (e) => { e.preventDefault(); renderQuestion(parseInt(a.dataset.jump)); });
      });
    }

    async function selectOption(questionId, optionId) {
      localAnswers[questionId] = optionId;
      renderQuestion(currentIndex); // instant UI feedback
      try {
        // Section 18: every answer is saved to the backend immediately,
        // not batched at the end — a refresh must not lose progress.
        await api(`/api/attempts/${attempt.attemptId}/answers`, {
          method: 'POST',
          body: JSON.stringify({ questionId, selectedOptionId: optionId })
        });
      } catch (err) {
        showError(errorBanner, err.message);
      }
    }

    async function doSubmit(isAutoSubmit) {
      if (submitting) return;
      submitting = true;
      clearInterval(countdownHandle);
      try {
        await api(`/api/attempts/${attempt.attemptId}/submit`, { method: 'POST' });
        window.location.href = `/result.html?attemptId=${attempt.attemptId}`;
      } catch (err) {
        showError(errorBanner, (isAutoSubmit ? 'Time is up, but submission failed: ' : '') + err.message);
        submitting = false;
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    start();
  </script>
</body>
</html>
