<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — Quiz System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="wordmark">Quiz System</span>
    <nav>
      <a href="/dashboard.html">Quizzes</a>
      <a href="/history.html">History</a>
      <a href="/profile.html">Progress</a>
      <a href="#" id="logoutLink">Sign out</a>
    </nav>
  </div>

  <div class="container">
    <h1>Your progress</h1>
    <div class="error-banner" id="errorBanner"></div>
    <div id="progressArea"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    requireAuth('USER');
    document.getElementById('logoutLink').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    const errorBanner = document.getElementById('errorBanner');

    async function load() {
      try {
        const p = await api('/api/attempts/progress');
        document.getElementById('progressArea').innerHTML = `
          <div class="stat-grid">
            <div class="stat-cell"><div class="stat-number">${p.totalAttempts}</div><div class="stat-label">Total attempts</div></div>
            <div class="stat-cell"><div class="stat-number">${p.completedAttempts}</div><div class="stat-label">Completed</div></div>
            <div class="stat-cell"><div class="stat-number">${p.abandonedAttempts}</div><div class="stat-label">Abandoned</div></div>
            <div class="stat-cell"><div class="stat-number">${p.bestScorePercentage.toFixed(0)}%</div><div class="stat-label">Best score</div></div>
            <div class="stat-cell"><div class="stat-number">${p.averageScorePercentage.toFixed(0)}%</div><div class="stat-label">Average score</div></div>
            <div class="stat-cell"><div class="stat-number">${p.latestScorePercentage.toFixed(0)}%</div><div class="stat-label">Latest score</div></div>
          </div>
        `;
      } catch (err) {
        showError(errorBanner, err.message);
      }
    }

    load();
  </script>
</body>
</html>
