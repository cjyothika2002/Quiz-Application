server:
  port: 8085

spring:
  application:
    name: quiz-system

  datasource:
    # Never hard-code DB credentials (Section 39). Pull from environment variables,
    # with sensible local-dev defaults after the colon.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quiz_system}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: Jyothika
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' during development: Hibernate adjusts the schema to match entities.
      # Switch to 'validate' once the schema is stable, and use a migration tool
      # (Flyway/Liquibase) for real production deployments.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    # 256-bit+ secret, must come from environment in real deployments — never committed.
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_VALUE_AT_LEAST_256_BITS}
    # 1 hour access token lifetime, in milliseconds
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  quiz:
    # TIME_PER_QUESTION from Section 13 - configurable, not hard-coded logic
    seconds-per-question: ${SECONDS_PER_QUESTION:60}
  admin:
    # Used only once, by AdminSeeder, to create the first ADMIN account if
    # none exists yet. Change these via env vars before any real deployment.
    email: ${ADMIN_EMAIL:admin@quizapp.com}
    password: ${ADMIN_PASSWORD:Admin@123}
